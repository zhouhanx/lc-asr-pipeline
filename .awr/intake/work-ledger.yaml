goals:
  - id: platform
    title: 交付可验证的多租户语音转写、OCR 与简历平台
    status: active
    priority: P0
    summary: >
      用户于 2026-10-12 要求使用 AWR 与 RTK 接管并分析当前项目。
      产品目标来自 llm-repo/wiki/lc-asr-pipeline-status.md（2026-07-24）：
      维持多租户转写、OCR、简历项目和简历撰写平台，并保留已验证的安全边界。
      本目标由交接文档和本次用户指令支持，不表示生产发布已验收。
    success_criteria:
      - 交接文档、未提交代码和运行状态被核对，不确定项保持显式。
      - 后续实现只从已确认目标和验收出发，不把占位页面或过期阶段勾选当成完成。
      - 凭据文件和环境赋值不进入 AWR 来源。

