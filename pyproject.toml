[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-asr-pipeline"
version = "0.1.0"
description = "Multi-tenant ASR workflow and agent platform"
requires-python = ">=3.10,<3.11"
dependencies = [
  "cryptography==49.0.0",
  "fastapi==0.138.0",
  "httpx==0.28.1",
  "langchain==1.3.11",
  "langgraph==1.2.6",
  "Pillow==12.3.0",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pwdlib[argon2]==0.3.0",
  "PyJWT==2.13.0",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.1",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
lc-asr-migrate = "lc_asr_pipeline.db.migrate:main"
lc-asr-worker = "lc_asr_pipeline.worker:main"
lc-asr-cleanup = "lc_asr_pipeline.cleanup:main"
lc-asr-retention-worker = "lc_asr_pipeline.retention_worker:main"

[tool.fastapi]
entrypoint = "lc_asr_pipeline.main:app"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the configured PostgreSQL service"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["lc_asr_pipeline"]
